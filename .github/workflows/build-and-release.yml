name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runs-on: ubuntu-24.04
            platform: linux-x86_64
            ext: tar.gz
            cmake-generator: Ninja
          - name: Linux ARM64
            runs-on: ubuntu-24.04-arm
            platform: linux-arm64
            ext: tar.gz
            cmake-generator: Ninja
          - name: Windows x86-64
            runs-on: windows-2022
            platform: windows-x86_64
            ext: zip
            cmake-generator: Visual Studio
            cmake-arch: x64
          - name: Windows ARM64
            runs-on: windows-11-arm
            platform: windows-arm64
            ext: zip
            cmake-generator: Visual Studio
            cmake-arch: ARM64
          - name: macOS Universal
            runs-on: macos-15
            platform: macos-universal
            ext: tar.gz
            cmake-generator: Ninja
            osx-architectures: "x86_64;arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^project(nn_cpp VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "Could not read the version from CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the CMake project version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux' && matrix.cmake-generator == 'Ninja'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake
        shell: bash
        run: |
          cmake_args=(
            -S .
            -B build
            -DCMAKE_BUILD_TYPE=Release
            -DNN_BUILD_APPS=ON
            -DNN_BUILD_TESTS=ON
            -DNN_NATIVE=OFF
          )

          if [ "${{ matrix.cmake-generator }}" = "Visual Studio" ]; then
            # Let CMake pick the newest Visual Studio installed on the runner
            cmake_args+=(-A "${{ matrix.cmake-arch }}")
          else
            cmake_args+=(-G "${{ matrix.cmake-generator }}")
          fi

          if [ -n "${{ matrix.osx-architectures }}" ]; then
            cmake_args+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.osx-architectures }}")
          fi

          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        id: package
        shell: bash
        run: |
          name="nn-cpp-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          cmake --install build --config Release --prefix "dist/$name"
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cmake -E tar cf "$name.zip" --format=zip "$name"
          else
            cmake -E tar czf "$name.tar.gz" "$name"
          fi
          echo "file=dist/$name.${{ matrix.ext }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nn-cpp-${{ matrix.platform }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches the CMake version
        run: |
          version=$(sed -n 's/^project(nn_cpp VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the CMake project version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create source archive
        run: git archive --format=tar.gz --prefix="nn-cpp-$VERSION/" -o "nn-cpp-$VERSION-source.tar.gz" HEAD

      - name: Download all artifacts from build job
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Validate artifacts
        run: |
          echo "Artifacts found:"
          if [ ! -d artifacts ] || [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "No artifacts were downloaded. Ensure build artifacts exist for this release/tag."
            exit 1
          fi
          find artifacts -type f -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            nn-cpp-${{ env.VERSION }}-source.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
